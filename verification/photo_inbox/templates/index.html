<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>SnoreDex-Fotoeingang</title>
<link rel="stylesheet" href="{{ url_for('static', filename='inbox.css') }}">
<script src="{{ url_for('static', filename='inbox.js') }}" defer></script>
</head>
<body>
<main>
<h1>Fotoeingang</h1>
<p>Gib ein eigenes Kartenfoto als JPEG im Heimnetz ab. Es bleibt privat und wird nicht veröffentlicht.</p>
<!-- No field has a name: without the script the form submits nothing, so the code never lands in a URL. -->
<form id="upload" method="post">
  <label for="photo">Foto (JPEG)</label>
  <input id="photo" type="file" accept="image/jpeg" required>
  <label for="specimen">SPEC-Nummer</label>
  <input id="specimen" placeholder="SPEC-0774" pattern="[Ss][Pp][Ee][Cc]-[0-9]{4,8}" autocapitalize="characters"
         autocomplete="off" aria-describedby="hint">
  <label for="note">Notiz zur Karte</label>
  <textarea id="note" maxlength="240" rows="3" placeholder="z. B. Relaxo, Dschungel, deutsch, 1. Auflage"
            aria-describedby="hint"></textarea>
  <p id="hint" class="hint">SPEC-Nummer oder Notiz: eines von beiden genügt.</p>
  <label class="check"><input id="owner" type="checkbox" required> Ich habe das Foto selbst aufgenommen.</label>
  <label for="code">Upload-Code <span class="hint">(bleibt nach dem ersten Upload auf diesem Gerät gespeichert)</span></label>
  <input id="code" required minlength="16" maxlength="128" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button type="submit">Hochladen</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
</main>
</body>
</html>
