<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>SnoreDex-Fotoeingang</title>
<link rel="stylesheet" href="{{ url_for('static', filename='inbox.css') }}">
<script src="{{ url_for('static', filename='inbox.js') }}" defer></script>
</head>
<body>
<main>
<h1>Fotoeingang</h1>
<p>Für eigene Kartenfotos, DNG oder JPEG. Die Fotos bleiben privat im Heimnetz und werden nicht
  veröffentlicht. Fotos aus anderen Quellen gehören nicht hierher.</p>

<section aria-labelledby="upload-title">
  <h2 id="upload-title">Hochladen</h2>
  <form id="upload" method="post">
    <label for="photos">Fotos (DNG oder JPEG, je bis 200 MB)</label>
    <input id="photos" type="file" multiple required
           accept=".dng,image/x-adobe-dng,image/dng,.jpg,.jpeg,image/jpeg">
    <button type="submit">Hochladen</button>
  </form>
  <ul id="transfers" aria-live="polite"></ul>
</section>

<section aria-labelledby="jobs-title">
  <h2 id="jobs-title">Fotos zuordnen</h2>
  <label class="check"><input id="open-only" type="checkbox"> Nur Fotos ohne Angabe</label>
  <p id="jobs-status" role="status"></p>
  <ul id="jobs"></ul>
</section>

<template id="job-template">
  <li class="job">
    <a class="photo" target="_blank" rel="noopener"><img alt="" loading="lazy" width="400" height="400"></a>
    <div class="facts"><span class="state"></span> <span class="when"></span></div>
    <form class="describe">
      <label>SPEC-Nummer<input name="specimen" placeholder="SPEC-0774" autocapitalize="characters"
             autocomplete="off" pattern="[Ss][Pp][Ee][Cc]-[0-9]{4,8}"></label>
      <label>Notiz zur Karte<textarea name="note" maxlength="240" rows="2"
             placeholder="z. B. Relaxo, Dschungel, deutsch, 1. Auflage"></textarea></label>
      <button type="submit">Speichern</button>
      <p class="saved" role="status"></p>
    </form>
  </li>
</template>
</main>
</body>
</html>
