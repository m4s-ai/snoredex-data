name: Publish site

# Deploys only from an explicit manual run on `main`, after both owner publication approval and
# the full release gate pass. Merging code or adding licence files cannot publish by itself.
#
# The published artifact is an explicit allowlist. Nothing is copied wholesale, so caches,
# browser state, verification scratch files and unrelated repository content cannot be
# published by accident.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  approval:
    name: Owner publication approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit publication decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          # Read the repository's real visibility rather than trusting the decision file's claim.
          actual=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)
          echo "GitHub reports visibility: ${actual}"
          python verification/publication_gate.py --actual-visibility "${actual}"

  gate:
    name: Release gate
    needs: approval
    uses: ./.github/workflows/release-gate.yml

  deploy:
    name: Deploy to Pages
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Publish only freshly generated output, so the deployed site can never be a stale
      # artifact that happens to be committed.
      - name: Regenerate site artifacts
        run: |
          python scripts/finishes.py --reproject
          python scripts/language_status.py
          python scripts/confirmed_releases.py
          python scripts/source_registry.py
          python scripts/source_capabilities.py
          python scripts/checklist.py
          python scripts/collector_catalogue.py
          python scripts/readme_stats.py
          python scripts/issue_templates.py
          python scripts/site.py

      - name: Assemble the public artifact from an allowlist
        run: |
          set -euo pipefail
          python scripts/publish.py --out _site
          echo "--- published tree ---"
          find _site -maxdepth 2 -type d | sort

      # This file is intentionally generated after checkout/assembly: only now
      # does the containing commit exist and only these exact bytes are deployable.
      - name: Bind collector bytes to the deployment commit
        run: |
          set -euo pipefail
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python scripts/collector_deployment.py \
            --catalogue _site/collector_catalogue.json \
            --out _site/collector_deployment.json \
            --artifact-commit "${GITHUB_SHA}" \
            --published-at "${published_at}"

      - name: Verify the assembled artifact
        run: |
          set -euo pipefail
          python scripts/publish.py --out _site --verify
          python scripts/collector_deployment.py \
            --check \
            --catalogue _site/collector_catalogue.json \
            --out _site/collector_deployment.json \
            --artifact-commit "${GITHUB_SHA}"
          python verification/publication_gate.py \
            --deployment-manifest _site/collector_deployment.json \
            --catalogue _site/collector_catalogue.json \
            --expected-commit "${GITHUB_SHA}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
