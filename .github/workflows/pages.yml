name: Publish site
run-name: Publish site ${{ inputs.request }}

# Deploys only from an explicit manual run on `main`, after both owner publication approval and
# the full release gate pass. Merging code or adding licence files cannot publish by itself.
#
# The published artifact is an explicit allowlist. Nothing is copied wholesale, so caches,
# browser state, verification scratch files and unrelated repository content cannot be
# published by accident.

on:
  workflow_dispatch:
    inputs:
      request:
        description: Left empty by hand; the photo inbox's intake run finds its own run by it (#673)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  approval:
    name: Owner publication approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require explicit publication decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          # Read the repository's real visibility rather than trusting the decision file's claim.
          actual=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)
          echo "GitHub reports visibility: ${actual}"
          python verification/publication_gate.py --actual-visibility "${actual}"

  gate:
    name: Release gate
    needs: approval
    uses: ./.github/workflows/release-gate.yml

  package:
    name: Upload verified Pages artifact
    needs: gate
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    outputs:
      artifact_name: ${{ env.PAGES_ARTIFACT }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The reusable release-gate job has already run L3/L4 and uploaded one exact Pages artifact
      # plus one gate manifest per OS. This job only verifies that handoff and packages those bytes;
      # it does not regenerate a second projection tree.
      - name: Download verified Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: pages-artifact
          path: _site

      - name: Download release gate manifests
        uses: actions/download-artifact@v8
        with:
          pattern: gate-manifest-*
          path: _gate
          merge-multiple: true

      - name: Verify checked artifact handoff
        run: |
          set -euo pipefail
          python verification/gate_manifest.py \
            --check-dir _gate \
            --commit "${GITHUB_SHA}" \
            --expected-gate L4 \
            --minimum 2
          python scripts/publish.py --out _site --verify
          python scripts/collector_deployment.py \
            --check \
            --catalogue _site/collector_catalogue.json \
            --out _site/collector_deployment.json \
            --artifact-commit "${GITHUB_SHA}"
          python verification/publication_gate.py \
            --deployment-manifest _site/collector_deployment.json \
            --catalogue _site/collector_catalogue.json \
            --expected-commit "${GITHUB_SHA}"

      # v4+ drops dotfiles unless asked; deploy exactly the verified bytes, .nojekyll included.
      - uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: _site
          include-hidden-files: true

  deploy:
    name: Deploy to Pages
    # Start after the upload job finishes. A deploy-only retry keeps its artifact name and bytes.
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.package.outputs.artifact_name }}
