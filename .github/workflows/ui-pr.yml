name: UI browser gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - index.html
      - site/app.css
      - site/app.js
      - snorlax_cards.json
      - analysis_checklist.json
      - collector_catalogue.json
      - images/**
      - verification/specimens/**
      - scripts/site.py
      - scripts/collector_catalogue.py
      - scripts/artwork_review.py
      - scripts/artwork_derivatives.py
      - verification/test_site.py
      - verification/artwork_review_projection.json
      - verification/artwork_derivative_manifest.json
      - requirements.txt
      - llms.txt
      - .github/workflows/ui-pr.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    # Like the release gate, draft pull requests skip the browser suite until ready for review.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: ui-browser (chromium)
    runs-on: ubuntu-latest
    steps:
      # verification/test_site.py reads the checked-out tree only; no Git history is needed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser test dependencies
        run: python -m pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium with Linux dependencies
        run: python -m playwright install --with-deps chromium

      - name: Browser behavior tests
        run: python verification/test_site.py
