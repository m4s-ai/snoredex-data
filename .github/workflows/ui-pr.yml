name: UI browser gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    # Page behaviour changes only with this code. Regenerated data (index.html, gallery.html,
    # images, stores) reaches the browser suite at L4 before every deploy, and the embedded table
    # projection is checked on every pull request by test_collector_catalogue.py.
    paths:
      - site/app.css
      - site/app.js
      - site/gallery.*
      - scripts/site.py
      - scripts/gallery.py
      - scripts/gallery_image_*.py
      - verification/prepare_gallery_images.py
      - verification/gallery_image_renderer.js
      - verification/test_gallery_preparation.py
      - verification/test_site.py
      - requirements.txt
      - .github/workflows/ui-pr.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    # Like the release gate, draft pull requests skip the browser suite until ready for review.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: ui-browser (chromium)
    runs-on: ubuntu-latest
    steps:
      # verification/test_site.py reads the checked-out tree only; no Git history is needed.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install browser test dependencies
        run: python -m pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium with Linux dependencies
        run: python -m playwright install --with-deps chromium

      - name: Browser behavior tests
        run: python verification/test_site.py
