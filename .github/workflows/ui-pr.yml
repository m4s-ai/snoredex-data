name: UI browser gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    # Page behaviour changes only with this code. Regenerated data reaches the browser suite at L4
    # before every deploy, and the release gate checks the built pages on every pull request.
    paths:
      - templates/index.html
      - site/**
      - scripts/build.py
      - verification/test_site.py
      - requirements.txt
      - .github/workflows/ui-pr.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    # Like the release gate, draft pull requests skip the browser suite until ready for review.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: ui-browser (chromium)
    runs-on: ubuntu-latest
    steps:
      # verification/test_site.py reads the checked-out tree only; no Git history is needed.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install browser test dependencies
        run: python -m pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium with Linux dependencies
        # The system packages --with-deps adds on a hosted runner are fonts. On 2026-11-11 the
        # runners (ubuntu-26.04 and ubuntu-24.04 alike) could not resolve the Ubuntu package hosts
        # for over an hour, and the job failed before any test ran. Fall back to the browser alone
        # then: the suite also passes on Windows, which has none of those packages, and the release
        # gate keeps the strict install before a deploy.
        run: |
          python -m playwright install --with-deps chromium || {
            echo "::warning::system packages could not be installed; running with the runner's own fonts"
            python -m playwright install chromium
          }

      - name: Browser behavior tests
        run: python verification/test_site.py
