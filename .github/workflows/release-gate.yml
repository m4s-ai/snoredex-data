name: Release gate

# Every check that must pass before the site may be published (#11), and the same suite a
# contributor can run locally. Called by pages.yml and runnable on its own.
#
# Two deliberate choices:
#
#  * Generators run and their output is compared against what is committed. A generated artifact
#    that disagrees with its inputs fails here rather than being published.
#  * Counts are never asserted by size. review_integrity.py reports them as drift, because closing
#    an open verification unit is the project's goal, and a gate that blocks on progress is a gate
#    people learn to bypass. A move in the losing direction does fail: each metric declares whether
#    up or down is progress, so an emptying queue is quiet and a refilling one is not (#69).

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    env:
      # Keep the checkout artifact-clean while generators import sibling modules.
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The browser suite runs on Linux only. Windows is here to prove the Python is
      # path-portable — the assumption the old PowerShell only satisfied by accident of its
      # provider normalising backslashes — and rendering is not path handling. Accepted cost: a
      # Windows-only rendering regression would reach main unseen. The page is generated once and
      # drawn by the same Chromium on both platforms, so that risk is judged small; if the site
      # ever grows platform-specific behaviour, restore this leg rather than inherit the decision.
      - name: Install Chromium with Linux dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      # --- syntax: every script must parse before anything is trusted to run ---
      - name: Parse every Python file
        shell: bash
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for path in pathlib.Path(".").rglob("*.py"):
              if any(part in {".git", "cache", "__pycache__"} for part in path.parts):
                  continue
              try:
                  ast.parse(path.read_text(encoding="utf-8"))
              except SyntaxError as error:
                  bad.append(f"{path}: {error}")
          print(f"parsed {len(list(pathlib.Path('.').rglob('*.py')))} Python files")
          if bad:
              sys.exit("\n".join(bad))
          PY

      # --- integrity: structural invariants, in both suites ---
      - name: Structural integrity
        run: python verification/review_integrity.py

      - name: Legacy candidate-universe contract
        run: python scripts/legacy_baseline.py --check

      # ADR-0001 is proposed, not in force, but its dry run must keep accounting for every legacy
      # row — a mapping that silently drops one is how a migration loses data later (#134).
      - name: Print identity dry run
        run: python scripts/print_identity_dryrun.py --check

      # Parser regression fixtures. The illustrator credit used to be read from the flattened page
      # text, which absorbed the adjacent stage label (#33); these fixtures are the page shapes that
      # broke it.
      - name: JP illustrator parser tests
        run: python verification/test_jp_parser.py

      - name: Owner adjudication regression tests
        run: python verification/test_owner_adjudications.py

      - name: Source-first adapter regression tests
        run: python verification/test_source_adapters.py

      # The bounded #148 backfill must account for every legacy alias, release row, language/date
      # relationship and finish unit without turning an absence into a set-level assertion.
      - name: Legacy set reconciliation regression tests
        run: python verification/test_legacy_set_reconciliation.py

      # Drift-metric polarity. A queue emptying is progress and a queue refilling is not, and the
      # suite could express neither until #69 — nor fail on either.
      - name: Metric polarity regression tests
        run: python verification/test_metric_polarity.py

      # Harness properties: importing the findings suite must stay free of side effects, and a
      # crash mid-collection must still render the checks that ran (#70).
      - name: Findings harness regression tests
        run: python verification/test_findings_harness.py

      - name: Evidence audit
        run: python verification/audit_evidence.py

      - name: Live finish-source verification
        if: runner.os == 'Linux'
        run: python verification/verify_finish_sources.py

      - name: Cross-artifact consistency and publication readiness
        run: python verification/review_findings.py

      # --- determinism: committed artifacts must match what the generators produce ---
      - name: Generated artifacts match their inputs
        shell: bash
        run: |
          python scripts/analyze.py --check
          python scripts/finishes.py --reproject
          python scripts/language_status.py
          python scripts/confirmed_releases.py
          python scripts/source_registry.py --check
          python scripts/source_capabilities.py --check
          python scripts/source_adapters.py --check
          python scripts/legacy_set_reconciliation.py --check
          python scripts/checklist.py --check
          python scripts/readme_stats.py --check
          python scripts/issue_templates.py --check
          python scripts/open_items.py --check
          python scripts/database.py --check
          python scripts/tracker.py check-template
          python scripts/site.py --check
          git diff --exit-code || {
              echo "::error::Regenerating produced different output than what is committed."
              exit 1
            }

      # --- behaviour: the page has to actually work ---
      - name: Browser tests
        if: runner.os == 'Linux'
        run: python verification/test_site.py

      # --- artifact hygiene ---
      - name: Public artifact contains only allowlisted files
        run: |
          python scripts/publish.py --out _site
          python scripts/publish.py --out _site --verify

      - name: No absolute paths, secrets, or caches in the tree
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, sys
          # review_findings.py check P4 covers the tracked tree; this catches anything that
          # slipped in during the workflow itself, such as a cache directory.
          leaked = [
              str(p) for p in pathlib.Path(".").rglob("*")
              if p.is_dir() and p.name in {"cache", "zoom", "__pycache__", ".pytest_cache"}
              and ".git" not in p.parts and "_site" not in p.parts
          ]
          if leaked:
              sys.exit("cache directories present in the build tree: " + ", ".join(leaked))
          print("no cache directories in the build tree")
          PY
