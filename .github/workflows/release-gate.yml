name: Release gate

# Every check that must pass before the site may be published (#11), and the same suite a
# contributor can run locally. Called by pages.yml and runnable on its own. The executable core
# order is owned by scripts/regen.py; WORKFLOW-MAP.md is the human-readable DAG and gate reference.
#
# Two deliberate choices:
#
#  * Generators run and their output is compared against what is committed. A generated artifact
#    that disagrees with its inputs fails here rather than being published.
#  * Counts are never asserted by size. review_integrity.py reports them as drift, because closing
#    an open verification unit is the project's goal, and a gate that blocks on progress is a gate
#    people learn to bypass. A move in the losing direction does fail: each metric declares whether
#    up or down is progress, so an emptying queue is quiet and a refilling one is not (#69).

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Draft PRs are intentionally in the Codex review loop: avoid spending the full two-OS
    # release gate on every review-fix push. Marking the PR ready starts the gate again, and
    # workflow_dispatch remains available for an explicit check at any time.
    if: ${{ github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: gate (${{ matrix.os }})
    env:
      # Keep the checkout artifact-clean while generators import sibling modules.
      PYTHONDONTWRITEBYTECODE: "1"
      # Windows defaults redirected Python output to cp1252; card data includes δ and other Unicode.
      PYTHONUTF8: "1"
      GATE_LEVEL: ${{ github.event_name == 'pull_request' && 'L3' || 'L4' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser test dependencies
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements.txt

      # The browser suite runs on Linux only. Windows is here to prove the Python is
      # path-portable — the assumption the old PowerShell only satisfied by accident of its
      # provider normalising backslashes — and rendering is not path handling. Accepted cost: a
      # Windows-only rendering regression would reach main unseen. The page is generated once and
      # drawn by the same Chromium on both platforms, so that risk is judged small; if the site
      # ever grows platform-specific behaviour, restore this leg rather than inherit the decision.
      - name: Install Chromium with Linux dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      # --- syntax: every script must parse before anything is trusted to run ---
      - name: Parse every Python file
        shell: bash
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for path in pathlib.Path(".").rglob("*.py"):
              if any(part in {".git", "cache", "__pycache__"} for part in path.parts):
                  continue
              try:
                  ast.parse(path.read_text(encoding="utf-8"))
              except SyntaxError as error:
                  bad.append(f"{path}: {error}")
          print(f"parsed {len(list(pathlib.Path('.').rglob('*.py')))} Python files")
          if bad:
              sys.exit("\n".join(bad))
          PY

      # --- core gate: integrity, regressions and generator determinism (#213) ---
      # The script owns this list so local readiness and CI cannot drift apart.
      - name: Generated artifacts and core regressions
        run: python scripts/regen.py --check

      - name: Live finish-source verification
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: python verification/verify_finish_sources.py

      # --- behaviour: the page has to actually work ---
      - name: Browser tests
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: python verification/test_site.py

      # --- artifact hygiene ---
      - name: Public artifact contains only allowlisted files
        if: github.event_name != 'pull_request'
        run: |
          python scripts/publish.py --out _site
          python scripts/publish.py --out _site --verify

      - name: Bind checked artifact to the commit
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "commit=${GITHUB_SHA} gate=${GATE_LEVEL} result=passed manifest=collector_deployment.json"
          python scripts/collector_deployment.py \
            --catalogue _site/collector_catalogue.json \
            --out _site/collector_deployment.json \
            --artifact-commit "${GITHUB_SHA}" \
            --published-at "${published_at}"

      - name: Verify checked artifact and publication decision
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish.py --out _site --verify
          python scripts/collector_deployment.py \
            --check \
            --catalogue _site/collector_catalogue.json \
            --out _site/collector_deployment.json \
            --artifact-commit "${GITHUB_SHA}"
          python verification/publication_gate.py \
            --deployment-manifest _site/collector_deployment.json \
            --catalogue _site/collector_catalogue.json \
            --expected-commit "${GITHUB_SHA}"

      - name: Emit successful gate manifest
        shell: bash
        run: |
          python verification/gate_manifest.py \
            --out "_gate/gate-manifest-${RUNNER_OS}.json" \
            --gate-level "${GATE_LEVEL}" \
            --commit "${GITHUB_SHA}"

      - name: Upload gate manifest
        uses: actions/upload-artifact@v4
        with:
          name: gate-manifest-${{ matrix.os }}
          path: _gate/gate-manifest-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload checked Pages artifact
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pages-artifact
          path: _site
          if-no-files-found: error
          retention-days: 7

      - name: No absolute paths, secrets, or caches in the tree
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, sys
          # review_findings.py check P4 covers the tracked tree; this catches anything that
          # slipped in during the workflow itself, such as a cache directory.
          leaked = [
              str(p) for p in pathlib.Path(".").rglob("*")
              if p.is_dir() and p.name in {"cache", "zoom", "__pycache__", ".pytest_cache"}
              and ".git" not in p.parts and "_site" not in p.parts
          ]
          if leaked:
              sys.exit("cache directories present in the build tree: " + ", ".join(leaked))
          print("no cache directories in the build tree")
          PY

  post-push:
    if: ${{ github.event_name == 'push' }}
    name: post-push P6/P7 audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit the published commit history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "commit=${GITHUB_SHA} gate=P6/P7 result=running"
          set +e
          python verification/review_findings.py 2>&1 | tee post-push-findings.log
          status=${PIPESTATUS[0]}
          set -e
          grep -F "[ ok ] P6" post-push-findings.log
          grep -F "[ ok ] P7" post-push-findings.log
          test "${status}" -eq 0
          echo "commit=${GITHUB_SHA} gate=P6/P7 result=passed"
