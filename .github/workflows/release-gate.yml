name: Release gate

# scripts/regen.py owns the executable core order.

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Draft pull requests skip the two-platform gate.
    if: ${{ github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: gate (${{ matrix.os }})
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      GATE_LEVEL: ${{ github.event_name == 'pull_request' && 'L3' || 'L4' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Verification memo (#460): steps whose observed inputs are unchanged since they passed on
      # this branch or on main are reported instead of rerun. L4 never restores it.
      - name: Restore verification memo
        if: env.GATE_LEVEL == 'L3'
        uses: actions/cache/restore@v5
        with:
          path: .git/snoredex-memo
          key: snoredex-memo-v1-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            snoredex-memo-v1-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-
            snoredex-memo-v1-${{ runner.os }}-main-

      - name: Install browser test dependencies
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: python -m pip install -r requirements.txt

      # Browser behavior is platform independent. Windows verifies path portability.
      - name: Install Chromium with Linux dependencies
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: python -m playwright install --with-deps chromium

      - name: Parse every Python file
        shell: bash
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for path in pathlib.Path(".").rglob("*.py"):
              if any(part in {".git", "cache", "__pycache__"} for part in path.parts):
                  continue
              try:
                  ast.parse(path.read_text(encoding="utf-8"))
              except SyntaxError as error:
                  bad.append(f"{path}: {error}")
          print(f"parsed {len(list(pathlib.Path('.').rglob('*.py')))} Python files")
          if bad:
              sys.exit("\n".join(bad))
          PY

      - name: Generated artifacts and core regressions
        shell: bash
        run: |
          if [ "${GATE_LEVEL}" = "L4" ]; then memo=off; else memo=use; fi
          python scripts/regen.py --check --memo "${memo}"

      # Every PR runs the retained-run validation; the memo replays it when none of the files it
      # reads changed (#460). This replaces a hand-kept path filter that rarely skipped anything.
      - name: Full retained discovery history
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "${GATE_LEVEL}" = "L4" ]; then memo=off; else memo=use; fi
          python scripts/check_memo.py run --memo "${memo}" -- scripts/source_adapters.py --check --full-refresh
          python scripts/check_memo.py run --memo "${memo}" -- scripts/card_discovery.py --check --full-refresh

      - name: Live finish-source verification
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: python verification/verify_finish_sources.py

      - name: Browser tests
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: python verification/test_site.py

      - name: Public artifact contains only allowlisted files
        if: github.event_name != 'pull_request'
        run: |
          python scripts/publish.py --out _site
          python scripts/publish.py --out _site --verify

      - name: Bind checked artifact to the commit
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "commit=${GITHUB_SHA} gate=${GATE_LEVEL} result=passed manifest=collector_deployment.json"
          python scripts/collector_deployment.py \
            --catalogue _site/collector_catalogue.json \
            --out _site/collector_deployment.json \
            --artifact-commit "${GITHUB_SHA}" \
            --published-at "${published_at}"

      - name: Verify checked artifact and publication decision
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish.py --out _site --verify
          python scripts/collector_deployment.py \
            --check \
            --catalogue _site/collector_catalogue.json \
            --out _site/collector_deployment.json \
            --artifact-commit "${GITHUB_SHA}"
          python verification/publication_gate.py \
            --deployment-manifest _site/collector_deployment.json \
            --catalogue _site/collector_catalogue.json \
            --expected-commit "${GITHUB_SHA}"

      - name: Emit successful gate manifest
        shell: bash
        run: |
          python verification/gate_manifest.py \
            --out "_gate/gate-manifest-${RUNNER_OS}.json" \
            --gate-level "${GATE_LEVEL}" \
            --commit "${GITHUB_SHA}"

      - name: Upload gate manifest
        uses: actions/upload-artifact@v6
        with:
          name: gate-manifest-${{ matrix.os }}
          path: _gate/gate-manifest-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload checked Pages artifact
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: pages-artifact
          path: _site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Only passed steps are stored, so a failing run may still save: the next push reruns the
      # failure and whatever changed.
      - name: Save verification memo
        if: always() && env.GATE_LEVEL == 'L3'
        uses: actions/cache/save@v5
        with:
          path: .git/snoredex-memo
          key: snoredex-memo-v1-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}

      - name: No absolute paths, secrets, or caches in the tree
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, sys
          leaked = [
              str(p) for p in pathlib.Path(".").rglob("*")
              if p.is_dir() and p.name in {"cache", "zoom", "__pycache__", ".pytest_cache"}
              and ".git" not in p.parts and "_site" not in p.parts
          ]
          if leaked:
              sys.exit("cache directories present in the build tree: " + ", ".join(leaked))
          print("no cache directories in the build tree")
          PY

  # Each push to main runs every core step once more (a reference run) and seeds the memo that
  # new pull requests restore. It is off the pull-request critical path (#460).
  memo-seed:
    if: ${{ github.event_name == 'push' }}
    name: seed verification memo (${{ matrix.os }})
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore previous main memo
        uses: actions/cache/restore@v5
        with:
          path: .git/snoredex-memo
          key: snoredex-memo-v1-${{ runner.os }}-main-${{ github.run_id }}
          restore-keys: snoredex-memo-v1-${{ runner.os }}-main-

      - name: Full core gate on main, refreshing the memo
        run: python scripts/regen.py --check --memo refresh

      - name: Full retained discovery history (refresh)
        if: runner.os == 'Linux'
        run: |
          python scripts/check_memo.py run --memo refresh -- scripts/source_adapters.py --check --full-refresh
          python scripts/check_memo.py run --memo refresh -- scripts/card_discovery.py --check --full-refresh

      - name: Save main memo
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .git/snoredex-memo
          key: snoredex-memo-v1-${{ runner.os }}-main-${{ github.run_id }}

  post-push:
    if: ${{ github.event_name == 'push' }}
    name: post-push P6/P7 audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # GitHub serves every pull request's head permanently, so they are published history too
      # (#467). Mapped under a `/pull/` path: P6 (`--all`) scans them, P7's merge-ref filter skips
      # them as before.
      - name: Fetch published pull-request heads
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pull/*/head'

      # Restore only: memo-seed alone saves, so a partial cache never shadows the full one.
      - name: Restore main memo
        uses: actions/cache/restore@v5
        with:
          path: .git/snoredex-memo
          key: snoredex-memo-v1-Linux-main-${{ github.run_id }}
          restore-keys: snoredex-memo-v1-Linux-main-

      - name: Audit the published commit history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "commit=${GITHUB_SHA} gate=P6/P7 result=running"
          set +e
          python verification/review_findings.py --scope publication 2>&1 | tee post-push-findings.log
          status=${PIPESTATUS[0]}
          set -e
          grep -F "[ ok ] P6" post-push-findings.log
          grep -F "[ ok ] P7" post-push-findings.log
          test "${status}" -eq 0
          echo "commit=${GITHUB_SHA} gate=P6/P7 result=passed"
