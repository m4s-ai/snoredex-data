name: Inbox image

# Builds the photo inbox's container image and checks it runs: Tesseract's languages, the number
# guard's tests and a smoke test of the started inbox against this checkout (#626, #657, #658).
on:
  pull_request:
    paths:
      - verification/photo_inbox/**
      - verification/*.py
      - scripts/**
      - .github/workflows/inbox-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inbox-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: compose.yaml and env.example are valid together
        working-directory: verification/photo_inbox/docker
        run: cp env.example .env && docker compose config -q && rm .env
      - name: Build the image
        run: docker build -f verification/photo_inbox/docker/Dockerfile -t snoredex-inbox .
      - name: Tesseract has the collection's languages
        run: |
          docker run --rm --entrypoint tesseract snoredex-inbox --list-langs > langs.txt
          for lang in eng jpn deu chi_sim chi_tra kor fra ita spa por ind tha rus pol nld; do
            grep -qx "$lang" langs.txt || { echo "missing language: $lang"; exit 1; }
          done
      - name: Number guard tests in the image
        run: docker run --rm --entrypoint python snoredex-inbox verification/photo_inbox/test_number_check.py
      - name: Start the inbox against this checkout
        run: |
          mkdir -p "$RUNNER_TEMP/inbox" "$RUNNER_TEMP/photos"
          chmod 777 "$RUNNER_TEMP/inbox"
          docker run -d --name inbox -p 8765:8765 \
            -v "$RUNNER_TEMP/inbox:/data" \
            -v "$PWD:/checkouts/snoredex-data:ro" \
            -v "$RUNNER_TEMP/photos:/checkouts/snoredex-photos:ro" \
            snoredex-inbox
      - name: Smoke test inside the running container
        run: docker exec inbox python verification/photo_inbox/docker/smoke.py http://127.0.0.1:8765
      - name: Inbox log
        if: always()
        run: docker logs inbox || true
