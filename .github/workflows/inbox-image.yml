name: Inbox image

# Builds the photo inbox's container image and checks it runs: Tesseract's languages, the number
# guard's tests and a smoke test of the started inbox against this checkout (#626, #657, #658).
# Beside it the inbox's own suites run: the page, intake on synthetic data and the Instagram
# exporter (#677). Documentation alone starts neither; the release gate runs on every pull request
# and stays the required check. verification/test_inbox_ci.py checks this filter.
on:
  pull_request:
    paths:
      - verification/photo_inbox/**
      - verification/*.py
      - scripts/**
      - requirements.txt
      - .github/workflows/inbox-image.yml
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inbox-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: compose.yaml and env.example are valid together
        working-directory: verification/photo_inbox/docker
        run: cp env.example .env && docker compose config -q
      - name: Build the image (with the .env present, as on the Homelab)
        run: |
          docker build -f verification/photo_inbox/docker/Dockerfile -t snoredex-inbox \
            --build-arg GIT_COMMIT="$(git rev-parse HEAD)" --build-arg BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" .
      - name: The .env with the uploader key stays out of the image
        run: docker run --rm --entrypoint sh snoredex-inbox -c '! find / -xdev -name .env 2>/dev/null | grep -q .'
      - name: Tesseract has the collection's languages
        run: |
          docker run --rm --entrypoint tesseract snoredex-inbox --list-langs > langs.txt
          for lang in eng jpn deu chi_sim chi_tra kor fra ita spa por ind tha rus pol nld; do
            grep -qx "$lang" langs.txt || { echo "missing language: $lang"; exit 1; }
          done
      - name: The image has the accepted tools (#681)
        run: docker run --rm --entrypoint python snoredex-inbox verification/photo_inbox/toolchain.py --check
      - name: Number guard tests in the image
        run: docker run --rm --entrypoint python snoredex-inbox verification/photo_inbox/test_number_check.py
      - name: Intake run tests in the image (#659)
        run: docker run --rm --entrypoint python snoredex-inbox verification/photo_inbox/test_runner.py
      - name: Start the inbox against this checkout
        run: |
          mkdir -p "$RUNNER_TEMP/inbox" "$RUNNER_TEMP/photos"
          chmod 777 "$RUNNER_TEMP/inbox"
          docker run -d --name inbox -p 8765:8765 \
            -v "$RUNNER_TEMP/inbox:/data" \
            -v "$PWD:/checkouts/snoredex-data:ro" \
            -v "$RUNNER_TEMP/photos:/checkouts/snoredex-photos:ro" \
            snoredex-inbox
      - name: Smoke test inside the running container
        run: docker exec inbox python verification/photo_inbox/docker/smoke.py http://127.0.0.1:8765
      - name: Inbox log
        if: always()
        run: docker logs inbox || true

  suites:
    name: inbox suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"  # the image's Python

      - name: Install the browser requirements and the inbox's locked packages
        run: python -m pip install -r requirements.txt -r verification/photo_inbox/requirements.lock

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # No --with-deps, as in ui-pr.yml: the suites need no extra fonts.
      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Inbox page, upload, trash, overview and corners (test_app.py)
        run: python verification/photo_inbox/test_app.py

      # Synthetic photos only; with a photo checkout, --photos also rebuilds SPEC-1125 byte for byte.
      - name: Intake on synthetic data (test_intake.py)
        run: python verification/photo_inbox/test_intake.py

      - name: Instagram exporter (test_instagram_package.py)
        run: python verification/test_instagram_package.py
