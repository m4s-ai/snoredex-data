# GENERATED by scripts/issue_templates.py — do not hand-edit.
# Dropdown options come from verification/finish_units.json so they cannot drift from
# the vocabulary the project actually models.
name: Printing correction
description: Correct or add a physical printing — finish, foil pattern, stamp, language, or size.
title: "[Correction] "
labels: ["Correction", "Needs Evidence"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping correct the catalogue.

        **Most fields below are pre-filled** if you arrived from a *Correction?* link on the
        collection page. You normally only need to tick the right boxes and describe what is
        wrong.

        Two things worth knowing before you fill this in:

        - **`pending` means *not yet established*, never *does not exist*.** If the site shows
          a finish as pending, that is not a claim that it is unavailable — so there is nothing
          to correct unless you have seen the printing.
        - **We cannot act on "it isn't listed anywhere".** A source failing to mention a
          printing is a gap in that source, not evidence of absence. This rule exists because
          an absence argument once produced a false correction here that had to be reverted.
          Positive evidence — a photo, a listing, a card in your hands — is what moves a claim.
  - type: markdown
    attributes:
      value: "### Which row"
  - type: input
    id: row-id
    attributes:
      label: "Row ID"
      description: "Stable identifier of the row you are correcting. Pre-filled from the link; leave it as-is."
      placeholder: "e.g. jtg-117-v1-unl"
    validations:
      required: true
  - type: input
    id: card-name
    attributes:
      label: "Card name"
      description: "Pre-filled from the link."
      placeholder: "e.g. Hop's Snorlax"
  - type: input
    id: set-code
    attributes:
      label: "Set code and expansion"
      description: "Pre-filled from the link."
      placeholder: "e.g. JTG — Journey Together"
  - type: input
    id: card-number
    attributes:
      label: "Collector number"
      description: "Pre-filled from the link."
      placeholder: "e.g. 117"
  - type: textarea
    id: current-state
    attributes:
      label: "What the site currently records"
      description: "Pre-filled from the link so we can see exactly what you saw. Please do not edit it."
  - type: markdown
    attributes:
      value: "### What is wrong"
  - type: checkboxes
    id: correction-type
    attributes:
      label: "What needs correcting"
      description: "Tick everything that applies."
      options:
        - label: "A finish is missing (the card exists in a finish not shown)"
        - label: "A finish is shown that does not exist"
        - label: "The foil pattern is wrong or missing"
        - label: "The stamp / marking is wrong or missing"
        - label: "A language is missing"
        - label: "A language is shown that was never printed"
        - label: "The edition (1st Edition / Unlimited) is wrong"
        - label: "The card size (standard / jumbo) is wrong"
        - label: "The release date is wrong"
        - label: "The artist is wrong or missing"
        - label: "The image is wrong"
        - label: "Something else (described below)"
  - type: markdown
    attributes:
      value: |
        ### The printing you are reporting

        Describe **the physical card you have seen**, not what the site shows.
        Leave a field blank if you are not sure — a blank is far more useful than a guess.
  - type: checkboxes
    id: finishes
    attributes:
      label: "Finishes that DO exist"
      description: "Tick every finish you can positively confirm for this card, language and edition."
      options:
        - label: "Non-Holo"
        - label: "Holo"
        - label: "Reverse Holo"
        - label: "Mirror Holo"
  - type: dropdown
    id: foil-pattern
    attributes:
      label: "Foil pattern"
      description: "The pattern of the foil itself. Poké Ball and Master Ball are Mirror Holo patterns, not Reverse Holo — pick the pattern you can see and we will map it to the right finish."
      options:
        - "Not applicable / non-holo"
        - "I do not know"
        - "Colorless energy star"
        - "Cosmos"
        - "Crosshatch"
        - "Energy symbol + Poké Ball artwork"
        - "Fireworks"
        - "Flat foil card body"
        - "Intricate tiled type symbol"
        - "Large type symbol (left)"
        - "Master Ball"
        - "Plain foil background"
        - "Plain foil on the Pokémon"
        - "Poké Ball"
        - "Tiled type symbol"
        - "Type symbol background"
        - "Other (describe below)"
  - type: dropdown
    id: stamp
    attributes:
      label: "Stamp or marking on the card"
      description: "A physical stamp printed on the card. A distribution stamp does not by itself make a card Reverse Holo."
      options:
        - "None"
        - "I do not know"
        - "Build-A-Bear Workshop"
        - "Call of Legends"
        - "EB Games"
        - "EX Dragon Frontiers"
        - "Gabriel Fernandez"
        - "GameStop"
        - "Journey Together"
        - "Mewtwo"
        - "Play! Pokemon"
        - "Pokemon Center"
        - "Prismatic Evolutions"
        - "Staff"
        - "Vivid Voltage"
        - "Other (describe below)"
  - type: dropdown
    id: language
    attributes:
      label: "Language"
      description: "The language of the card you are reporting."
      options:
        - "Not language-specific"
        - "Czech"
        - "Dutch"
        - "English"
        - "French"
        - "German"
        - "Hungarian"
        - "Indonesian"
        - "Italian"
        - "Japanese"
        - "Korean"
        - "Polish"
        - "Portuguese"
        - "Russian"
        - "S-Chinese"
        - "Spanish"
        - "T-Chinese"
        - "Thai"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: "Edition"
      description: "Only Base Set through Neo Destiny (Western) and ADV/e-Card through XY (Japanese) have a 1st Edition run."
      options:
        - "Not applicable / no edition system"
        - "I do not know"
        - "1st Edition"
        - "Unlimited"
        - "—"
  - type: dropdown
    id: card-size
    attributes:
      label: "Card size"
      description: "Jumbo cards are separate printings from their standard counterparts."
      options:
        - "Standard"
        - "Jumbo"
        - "I do not know"
  - type: dropdown
    id: distribution
    attributes:
      label: "How it was distributed"
      description: "If you know how this specific printing was released."
      options:
        - "I do not know"
        - "Booster set"
        - "Collection promo"
        - "Elite trainer box"
        - "Fixed deck"
        - "Gift with purchase"
        - "Pokemon center elite trainer box"
        - "Pokemon league"
        - "Prerelease"
        - "Prerelease staff"
        - "Prize pack"
        - "Retailer promo"
        - "Special collection"
        - "Tin exclusive"
        - "World championship deck"
        - "Other (describe below)"
  - type: markdown
    attributes:
      value: "### Details and evidence"
  - type: textarea
    id: description
    attributes:
      label: "What needs to be corrected?"
      description: "Describe the correction in your own words."
      placeholder: "e.g. This card also exists in a non-holo version in German — I have one in hand."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence"
      description: "Link a photo, marketplace listing, official checklist, or database entry. If the card is in your own collection, say so — that is recorded as an owner attestation and is graded accordingly. Attach photos by dragging them into this box."
      placeholder: "e.g. https://… , or: photo attached, card in my collection"
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: "Before submitting"
      options:
        - label: "This is **positive** evidence — I have seen this printing, rather than inferring it from something not being listed."
          required: true
  - type: markdown
    attributes:
      value: |
        ---
        Corrections are reviewed against the source ladder in
        [`verification/FINISH_SOURCES.md`](https://github.com/m4s-ai/snoredex-data/blob/main/verification/FINISH_SOURCES.md).
        Thank you — specimen reports have already overturned three databases at once here.
