{
  "name": "Printing correction",
  "description": "Correct or add a physical printing — finish, foil pattern, stamp, language, or size.",
  "title": "[Correction] ",
  "labels": [
    "Correction",
    "Needs Evidence"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "<!-- GENERATED by scripts/issue_templates.py — do not hand-edit. -->\n\nThanks for helping correct the catalogue.\n\n**Most fields below are pre-filled** if you arrived from a *Correction?* link on the\ncollection page. You normally only need to tick the right boxes and describe what is\nwrong.\n\nTwo things worth knowing before you fill this in:\n\n- **`pending` means *not yet established*, never *does not exist*.** If the site shows\n  a finish as pending, that is not a claim that it is unavailable — so there is nothing\n  to correct unless you have seen the printing.\n- **We cannot act on \"it isn't listed anywhere\".** A source failing to mention a\n  printing is a gap in that source, not evidence of absence. This rule exists because\n  an absence argument once produced a false correction here that had to be reverted.\n  Positive evidence — a photo, a listing, a card in your hands — is what moves a claim.\n"
      }
    },
    {
      "type": "markdown",
      "attributes": {
        "value": "### Which row"
      }
    },
    {
      "type": "input",
      "id": "row-id",
      "attributes": {
        "label": "Row ID",
        "description": "Stable identifier of the row you are correcting. Pre-filled from the link; leave it as-is.",
        "placeholder": "e.g. jtg-117-v1-unl"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "card-name",
      "attributes": {
        "label": "Card name",
        "description": "Pre-filled from the link.",
        "placeholder": "e.g. Hop's Snorlax"
      }
    },
    {
      "type": "input",
      "id": "set-code",
      "attributes": {
        "label": "Set code and expansion",
        "description": "Pre-filled from the link.",
        "placeholder": "e.g. JTG — Journey Together"
      }
    },
    {
      "type": "input",
      "id": "card-number",
      "attributes": {
        "label": "Collector number",
        "description": "Pre-filled from the link.",
        "placeholder": "e.g. 117"
      }
    },
    {
      "type": "textarea",
      "id": "current-state",
      "attributes": {
        "label": "What the site currently records",
        "description": "Pre-filled from the link so we can see exactly what you saw. Please do not edit it."
      }
    },
    {
      "type": "markdown",
      "attributes": {
        "value": "### What is wrong"
      }
    },
    {
      "type": "checkboxes",
      "id": "correction-type",
      "attributes": {
        "label": "What needs correcting",
        "options": [
          {
            "label": "A finish is missing (the card exists in a finish not shown)"
          },
          {
            "label": "A finish is shown that does not exist"
          },
          {
            "label": "The foil pattern is wrong or missing"
          },
          {
            "label": "The stamp / marking is wrong or missing"
          },
          {
            "label": "A language is missing"
          },
          {
            "label": "A language is shown that was never printed"
          },
          {
            "label": "The edition (1st Edition / Unlimited) is wrong"
          },
          {
            "label": "The card size (standard / jumbo) is wrong"
          },
          {
            "label": "The release date is wrong"
          },
          {
            "label": "The artist is wrong or missing"
          },
          {
            "label": "The image is wrong"
          },
          {
            "label": "Something else (described below)"
          }
        ],
        "description": "Tick everything that applies."
      }
    },
    {
      "type": "markdown",
      "attributes": {
        "value": "### The printing you are reporting\n\nDescribe **the physical card you have seen**, not what the site shows.\nLeave a field blank if you are not sure — a blank is far more useful than a guess.\n"
      }
    },
    {
      "type": "checkboxes",
      "id": "finishes",
      "attributes": {
        "label": "Finishes that DO exist",
        "options": [
          {
            "label": "Non-Holo"
          },
          {
            "label": "Holo"
          },
          {
            "label": "Reverse Holo"
          }
        ],
        "description": "Tick every collector-facing finish family you can positively confirm for this card, language and edition. Reverse Holo includes patterned reverse and mirror treatments."
      }
    },
    {
      "type": "dropdown",
      "id": "foil-pattern",
      "attributes": {
        "label": "Foil pattern",
        "options": [
          "Not applicable / non-holo",
          "I do not know",
          "Colorless energy star",
          "Cosmos",
          "Crosshatch",
          "Energy symbol + Poké Ball artwork",
          "Fireworks",
          "Flat foil card body",
          "Intricate tiled type symbol",
          "Large type symbol (left)",
          "Master Ball",
          "Plain foil background",
          "Plain foil on the Pokémon",
          "Poké Ball",
          "Sparkle holo across artwork and frame",
          "Textured full art",
          "Tiled type symbol",
          "Type symbol background",
          "Other (describe below)"
        ],
        "description": "The exact treatment within the finish family. For Poké Ball, Master Ball, energy and other patterned reverse or mirror treatments, select Reverse Holo above and identify the visible pattern here."
      }
    },
    {
      "type": "dropdown",
      "id": "stamp",
      "attributes": {
        "label": "Stamp or marking on the card",
        "options": [
          "No stamp",
          "I do not know",
          "Build-A-Bear Workshop",
          "Call of Legends",
          "CoroCoro Comic Illust Contest winning card",
          "EB Games",
          "EDITIE 1",
          "EDIZIONE 1",
          "EX Dragon Frontiers",
          "Gabriel Fernandez",
          "GameStop",
          "GameStop logo stamped in red over the lower left of the illustration",
          "Journey Together",
          "Mewtwo",
          "Mewtwo deck logo at lower right",
          "No rarity symbol",
          "Play! Pokemon",
          "Play! Pokémon Prize Pack stamp",
          "Pokemon Center",
          "Prismatic Evolutions",
          "Staff",
          "Uncommon rarity symbol",
          "Vivid Voltage",
          "Vivid Voltage set logo and STAFF",
          "black-star promo symbol",
          "Other (describe below)"
        ],
        "description": "A physical stamp or printed identity feature such as a rarity symbol or contest credit. A distribution stamp does not by itself make a card Reverse Holo."
      }
    },
    {
      "type": "dropdown",
      "id": "language",
      "attributes": {
        "label": "Language",
        "options": [
          "Not language-specific",
          "Czech",
          "Dutch",
          "English",
          "French",
          "German",
          "Hungarian",
          "Indonesian",
          "Italian",
          "Japanese",
          "Korean",
          "Polish",
          "Portuguese",
          "Russian",
          "S-Chinese",
          "Spanish",
          "T-Chinese",
          "Thai"
        ],
        "description": "The language of the card you are reporting."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "edition",
      "attributes": {
        "label": "Edition",
        "options": [
          "Not applicable / no edition system",
          "I do not know",
          "1st Edition",
          "Unlimited",
          "—"
        ],
        "description": "Only Base Set through Neo Destiny (Western) and ADV/e-Card through XY (Japanese) have a 1st Edition run."
      }
    },
    {
      "type": "dropdown",
      "id": "card-size",
      "attributes": {
        "label": "Card size",
        "options": [
          "Standard",
          "Jumbo",
          "I do not know"
        ],
        "description": "Jumbo cards are separate printings from their standard counterparts."
      }
    },
    {
      "type": "dropdown",
      "id": "distribution",
      "attributes": {
        "label": "How it was distributed",
        "options": [
          "I do not know",
          "Booster set",
          "Collection promo",
          "Elite trainer box",
          "Fixed deck",
          "Gift with purchase",
          "Pokemon center elite trainer box",
          "Pokemon league",
          "Prerelease",
          "Prerelease staff",
          "Prize pack",
          "Retailer promo",
          "Special collection",
          "Tin exclusive",
          "Vending sheet",
          "World championship deck",
          "Other (describe below)"
        ],
        "description": "If you know how this specific printing was released."
      }
    },
    {
      "type": "markdown",
      "attributes": {
        "value": "### Details and evidence"
      }
    },
    {
      "type": "textarea",
      "id": "description",
      "attributes": {
        "label": "What needs to be corrected?",
        "description": "Describe the correction in your own words.",
        "placeholder": "e.g. This card also exists in a non-holo version in German — I have one in hand."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "evidence",
      "attributes": {
        "label": "Evidence",
        "description": "Link a photo, marketplace listing, official checklist, or database entry. If the card is in your own collection, say so — that is recorded as an owner attestation and is graded accordingly. Attach photos by dragging them into this box.",
        "placeholder": "e.g. https://… , or: photo attached, card in my collection"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "acknowledgement",
      "attributes": {
        "label": "Before submitting",
        "options": [
          {
            "label": "This is **positive** evidence — I have seen this printing, rather than inferring it from something not being listed.",
            "required": true
          }
        ]
      }
    },
    {
      "type": "markdown",
      "attributes": {
        "value": "---\nCorrections are reviewed against the source ladder in\n[`verification/FINISH_SOURCES.md`](https://github.com/m4s-ai/snoredex-data/blob/main/verification/FINISH_SOURCES.md).\nThank you — specimen reports have already overturned three databases at once here.\n"
      }
    }
  ]
}
